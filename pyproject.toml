[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmrm"
version = "4.2.0"
description = "Topological Manifold Resonant Machine: Unified Predictive Machine Learning Architecture"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Balaji P", email = "balajikrishnan031@gmail.com"},
    {name = "Navaneetham V"},
    {name = "Dhavan RG"}
]
keywords = [
    "machine-learning",
    "topological-data-analysis",
    "riemannian-manifolds",
    "manifold-learning",
    "tabular-data",
    "ricci-curvature",
    "foundation-models"
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0"
]

[project.urls]
Homepage = "https://github.com/balajikrishnan031/TMRM"
Repository = "https://github.com/balajikrishnan031/TMRM.git"
"Bug Tracker" = "https://github.com/balajikrishnan031/TMRM/issues"
